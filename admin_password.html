<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropGuard AI - Change Admin Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- Admin Navigation -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/admin/dashboard">
                <i class="fa-solid fa-shield-halved text-success fs-3"></i>
                <span class="navbar-brand-text">CropGuard <span style="color: #74c69d;">Admin Portal</span></span>
            </a>
            <div class="navbar-nav ms-auto gap-2 align-items-center">
                <a class="nav-link nav-link-custom" href="/admin/dashboard"><i class="fa-solid fa-chart-line me-1"></i> Dashboard</a>
                <a class="nav-link nav-link-custom" href="/admin/fertilizers"><i class="fa-solid fa-vial me-1"></i> Fertilizer Rules</a>
                <a class="nav-link nav-link-custom active" href="/admin/password"><i class="fa-solid fa-key me-1"></i> Password</a>
                <a class="btn btn-outline-danger btn-sm rounded-pill px-3 ms-2" href="/admin/logout"><i class="fa-solid fa-right-from-bracket me-1"></i> Logout</a>
            </div>
        </div>
    </nav>

    <!-- Change Password Form -->
    <div class="container py-5">
        <div class="max-w-700 mx-auto glass-card bg-white p-5" style="max-width: 500px;">
            <div class="text-center mb-4">
                <i class="fa-solid fa-key text-success display-4 mb-2"></i>
                <h3 class="fw-bold text-success mb-1">Change Admin Password</h3>
                <p class="text-muted small">Update host administrative credentials</p>
            </div>

            <div id="pw-alert"></div>

            <form onsubmit="handlePasswordChange(event)">
                <div class="mb-3">
                    <label class="form-label fw-bold small text-muted">Current Password</label>
                    <input type="password" id="curr-pw" class="form-control rounded-3" placeholder="Enter current password" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small text-muted">New Password</label>
                    <input type="password" id="new-pw" class="form-control rounded-3" placeholder="Enter new password (min 6 chars)" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold small text-muted">Confirm New Password</label>
                    <input type="password" id="confirm-pw" class="form-control rounded-3" placeholder="Confirm new password" required>
                </div>
                <button type="submit" class="btn btn-success btn-lg rounded-pill w-100 fw-bold shadow-sm">
                    <i class="fa-solid fa-check me-2"></i> Update Admin Password
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function handlePasswordChange(e) {
            e.preventDefault();
            const curr = document.getElementById('curr-pw').value;
            const newPw = document.getElementById('new-pw').value;
            const confirmPw = document.getElementById('confirm-pw').value;

            const alertDiv = document.getElementById('pw-alert');
            if (newPw !== confirmPw) {
                alertDiv.innerHTML = '<div class="alert alert-danger">New passwords do not match.</div>';
                return;
            }

            try {
                const res = await fetch('/api/admin/change-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ current_password: curr, new_password: newPw })
                });
                const data = await res.json();
                if (data.success) {
                    alertDiv.innerHTML = '<div class="alert alert-success">Admin password updated successfully!</div>';
                    document.getElementById('curr-pw').value = '';
                    document.getElementById('new-pw').value = '';
                    document.getElementById('confirm-pw').value = '';
                } else {
                    alertDiv.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
                }
            } catch (err) {
                alertDiv.innerHTML = '<div class="alert alert-danger">Failed to update password.</div>';
            }
        }
    </script>
</body>
</html>
