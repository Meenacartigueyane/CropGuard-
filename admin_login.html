<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropGuard AI - Admin Portal Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center;">

    <div class="container py-5">
        <div class="max-w-700 mx-auto glass-card bg-white p-5" style="max-width: 450px;">
            
            <div class="text-center mb-4">
                <i class="fa-solid fa-shield-halved text-success display-4 mb-2"></i>
                <h3 class="fw-bold text-success mb-1">Host / Admin Login</h3>
                <p class="text-muted small">CropGuard AI Administrative Portal</p>
            </div>

            {% if error %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                {{ error }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endif %}

            <form action="/admin/login" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label fw-bold small text-muted">Admin Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                        <input type="text" id="username" name="username" class="form-control form-control-lg rounded-end fs-6" placeholder="Username" value="host" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-bold small text-muted">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input type="password" id="password" name="password" class="form-control form-control-lg rounded-end fs-6" placeholder="Password" value="CropGuard@2026" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-success btn-lg rounded-pill w-100 fw-bold shadow-sm">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Authenticate & Enter Portal
                </button>
            </form>

            <div class="mt-4 p-3 bg-light rounded-3 text-center border">
                <p class="small text-muted mb-1 fw-bold">🔑 Default Credentials:</p>
                <p class="small text-dark mb-0">Username: <code>host</code> &nbsp;|&nbsp; Password: <code>CropGuard@2026</code></p>
            </div>

            <div class="text-center mt-4">
                <a href="/" class="text-muted small text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Return to Public Landing Page</a>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
